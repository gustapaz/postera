<div class="writing-desk">
  <div class="desk-intro">
    <span>01 / A ESCRIVANINHA</span>
    <h2>Escreva para<br /><em>um outro tempo.</em></h2>
    <p>Use uma mensagem inventada.<br />Depois do selo, ela espera por você.</p>
  </div>
  <div if.bind="!d.catalog" class="load">
    <button click.trigger="a.init()">Tentar abrir a escrivaninha</button>
  </div>
  <template if.bind="d.catalog"
    ><div class="letter-editor">
      <div class="paper-picker">
        <button
          repeat.for="p of d.catalog.presets"
          disabled.bind="d.busy"
          click.trigger="a.preset(p)"
        >
          ${p.name} ↗
        </button>
      </div>
      <label
        >O que você diria?<textarea
          aria-label="Mensagem da cápsula"
          maxlength="280"
          rows="6"
          value.bind="d.input.message"
          input.trigger="inputMessage($event)"
          disabled.bind="d.current.published && d.owns"
          placeholder="A mensagem está selada. Releia depois da abertura."
        ></textarea>
      </label>
      <div class="letter-options">
        <label
          >Tempo de espera<select
            aria-label="Tempo de espera"
            value.bind="d.input.delay_seconds"
            change.trigger="inputDelay($event)"
            disabled.bind="d.current.published && d.owns"
          >
            <option model.bind="60">1 minuto</option>
            <option model.bind="3600">1 hora</option>
            <option model.bind="86400">1 dia</option>
            <option model.bind="518400">6 dias</option>
          </select></label
        >
        <fieldset>
          <legend>Papel</legend>
          <label
            repeat.for="paper of ['ivory','rose','night']"
            class="paper-option"
            ><input
              type="radio"
              name="paper"
              model.bind="paper"
              checked.bind="d.input.paper"
              change.trigger="change('paper',paper)"
              disabled.bind="d.current.published && d.owns"
            /><span
              >${paper === "ivory" ? "Marfim" : paper === "rose" ? "Rosa" :
              "Noite"}</span
            ></label
          >
        </fieldset>
      </div>
      <button
        class="prepare"
        disabled.bind="d.busy || (d.current.published && d.owns)"
        click.trigger="a.run()"
      >
        ${d.busy ? "Preparando…" : "Preparar a carta ↗"}
      </button>
      <p class="letter-count" if.bind="d.result">
        ${d.result.characters} caracteres · ${d.result.words} palavras · espera
        de ${d.result.delay_label}
      </p>
    </div>
    <div class="envelope-preview" class.bind="d.input.paper">
      <div class="envelope" class.bind="d.current.published ? 'is-sealed' : ''">
        <div class="sheet">
          <span>${d.title}</span>
          <p>
            ${d.current.locked ? "Esta palavra ainda pertence ao futuro." :
            d.input.message}
          </p>
          <small
            >${d.current.published ? "SELADA NO TEMPO" : "AINDA HÁ TEMPO DE
            REESCREVER"}</small
          >
        </div>
        <div class="pocket"></div>
        <div class="flap"></div>
        <div class="seal">p</div>
      </div>
      <div class="time-label" if.bind="d.current.published">
        <span>ABERTURA PELO SERVIDOR</span
        ><strong>${date(d.current.opens_at)}</strong>
        <p>
          ${d.current.locked ? "Aguarde a abertura. Releia para verificar." : "A
          espera terminou. A carta pode ser lida."}
        </p>
        <button disabled.bind="d.busy" click.trigger="reload()">
          Verificar abertura ↗
        </button>
      </div>
    </div>
    <section class="post-office">
      <div>
        <span>02 / ANTES DE SELAR</span
        ><label
          >Nome da cápsula<input
            aria-label="Nome da cápsula"
            maxlength="48"
            value.bind="d.title"
            input.trigger="inputTitle($event)"
            disabled.bind="d.current.published && d.owns" /></label
        ><button
          disabled.bind="d.busy || !d.result || (d.current.published && d.owns)"
          click.trigger="a.save()"
        >
          ${d.current && d.owns ? "Salvar rascunho" : "Guardar rascunho"} ↗
        </button>
        <p>
          Rascunhos e cartas duram 7 dias. Depois de selar, o prazo de 7 dias
          recomeça. O acesso de edição fica nesta aba.
        </p>
      </div>
      <div>
        <template if.bind="d.current"
          ><p class="seal-warning" if.bind="!d.current.published && d.owns">
            O selo é definitivo. Confirme o conteúdo e o intervalo antes de
            continuar.
          </p>
          <button
            class="seal-action"
            if.bind="!d.current.published && d.owns"
            disabled.bind="d.busy"
            click.trigger="seal()"
          >
            Selar definitivamente e criar link ↗</button
          ><button disabled.bind="d.busy" click.trigger="reload()">
            Reler do banco</button
          ><button
            disabled.bind="d.busy || d.current.locked"
            click.trigger="a.download()"
          >
            Exportar carta TXT ↓</button
          ><button disabled.bind="d.busy" click.trigger="a.fresh()">
            Nova cápsula
          </button></template
        ><a if.bind="d.link" href.bind="d.link" target="_blank" rel="noreferrer"
          >Abrir cápsula compartilhada ↗</a
        >
        <details>
          <summary>Correspondências desta aba (${d.archive.length})</summary>
          <button repeat.for="x of d.archive" click.trigger="a.open(x.id)">
            ${x.title} ↗
          </button>
        </details>
      </div>
    </section></template
  >
  <p class="status" role="status">${d.error || d.status}</p>
</div>
